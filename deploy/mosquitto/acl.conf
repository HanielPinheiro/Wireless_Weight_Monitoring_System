# =================================================================
# PreciousWeight - topic access control
#
# There is no "user anonymous" block on purpose: allow_anonymous is
# set to false, so unauthenticated clients are rejected before the
# ACL is even consulted.
# =================================================================

# --- Backend ------------------------------------------------------
# Must match MQTT_BROKER_USER in your environment.
# The backend subscribes to /weights, /status and /wifi and publishes
# commands to /scales.
user pw_api
topic readwrite /weights/#
topic readwrite /status/#
topic readwrite /wifi/#
topic readwrite /scales/#

# --- Scales (TLS listener only) -----------------------------------
# On the TLS listener the username is the Common Name of the client
# certificate. Replace DEVICE_CN with the CN you used when generating
# client.crt (the reference firmware used "ESP32").
# Repeat the block once per device if you issue one certificate each.
#user DEVICE_CN
#topic readwrite /weights/#
#topic readwrite /status/#
#topic readwrite /wifi/#
#topic readwrite /scales/#
