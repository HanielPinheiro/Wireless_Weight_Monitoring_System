# =================================================================
# PreciousWeight - local Mosquitto broker
#
# How to use this file:
#   1. open a terminal in THIS folder (the paths below are relative)
#   2. create the broker user once:  mosquitto_passwd -c passwd pw_api
#   3. create the data folder once:  mkdir data
#   4. start the broker:             mosquitto -c mosquitto.conf
#
# If you move this file somewhere else, the relative paths must be
# updated to absolute ones.
# =================================================================

# --- Listener used by the backend ---------------------------------
# Bound to 127.0.0.1: only this machine can reach it.
listener 5278 127.0.0.1
allow_anonymous false
password_file ./passwd
acl_file ./acl.conf

# --- Persistence --------------------------------------------------
persistence true
persistence_location ./data/
autosave_interval 60

# --- Logging ------------------------------------------------------
log_dest stdout
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =================================================================
# TLS listener for the physical scales (optional - hardware only).
#
# Leave it commented out until you have generated the certificates
# described in
#   Esp32_Codigo/CodigoPrincipal/comm/mqtt_config/certs/README.md
# Put ca.crt / server.crt / server.key in ./certs/ and uncomment.
#
# require_certificate + use_identity_as_username make the certificate
# Common Name the MQTT username, which is what the ACL file matches.
# =================================================================
