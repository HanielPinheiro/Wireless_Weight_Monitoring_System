# Local development database.
# Credentials are NOT stored here: copy .env.example to .env and fill it in.
services:
    mysql:
      container_name: precious-weight-mysql
      image: mysql:latest
      ports:
        - "3306:3306"
      expose:
        - "3306"
      environment:
        - MYSQL_USER=${PW_DB_APP_USER}
        - MYSQL_PASSWORD=${PW_DB_APP_PASS}
        - MYSQL_DATABASE=app_db
        - MYSQL_ROOT_PASSWORD=${PW_DB_ROOT_PASS}
      volumes:
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Initialization script
