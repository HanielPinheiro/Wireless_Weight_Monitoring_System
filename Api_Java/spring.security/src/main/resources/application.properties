# =================================================================
# PreciousWeight - backend configuration
#
# No credential is stored in this file. Every secret is read from an
# environment variable. Placeholders use the ${VAR} / ${VAR:default}
# syntax; when a variable has no default the application will refuse to
# start until it is defined, which is intentional (fail fast).
# See the README for the full list of variables.
# =================================================================

# JWT Keys (RS256). Point these to your own key pair.
# Public key: SPKI PEM ("BEGIN PUBLIC KEY").
# Private key: PKCS#8 PEM ("BEGIN PRIVATE KEY").
jwt.public.key = ${PW_JWT_PUB:classpath:app.pub}
jwt.private.key = ${PW_JWT_PRIV:classpath:app.key}

# Hibernate settings - to log with envers
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUDIT
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE
spring.jpa.defer-datasource-initialization=true

# SQL script initialization (seeding data in early db stage using DDL - OPTIONAL)
spring.sql.init.mode=never
#spring.sql.init.data-locations=classpath:start_script.sql

# Auth Database
spring.auth.datasource.jdbc-url=${PW_DB_AUTH_URL:jdbc:mysql://localhost:3306/auth_db}
spring.auth.datasource.username=${PW_DB_AUTH_USER}
spring.auth.datasource.password=${PW_DB_AUTH_PASS}
spring.auth.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Application Database
spring.app.datasource.jdbc-url=${PW_DB_APP_URL:jdbc:mysql://localhost:3306/app_db}
spring.app.datasource.username=${PW_DB_APP_USER}
spring.app.datasource.password=${PW_DB_APP_PASS}
spring.app.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Detailed Logs
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# MQTT
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:5278}
mqtt.broker.username=${MQTT_BROKER_USER}
mqtt.broker.password=${MQTT_BROKER_PASS}

logging.level.org.eclipse.paho.client.mqttv3.internal.CommsReceiver=INFO
logging.level.org.eclipse.paho.client.mqttv3.internal=INFO
logging.level.org.eclipse.paho.client.mqttv3=INFO
